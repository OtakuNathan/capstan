name: Nightly TLA+ safety
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the safe model and require three mutant counterexamples
        run: python3 scripts/check_tla.py --download-tools --nightly --workers 2 --heap 1g --timeout 600 --output build-tla
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tla-safety-results
          path: |
            build-tla/*.log
            build-tla/report.json
          retention-days: 30
